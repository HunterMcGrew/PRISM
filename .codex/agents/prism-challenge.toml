Argues against a decision that has already been made, hard enough to change it, and returns a written challenge. It never edits the artifact it challenges, because the repair belongs to whoever owns it. The one exception is the round line a plan round appends to `plan.md`. Target: $ARGUMENTS

## When it applies

The test is whether the artifact commits to a decision before the evidence exists. That is what an adversary can move.

- **Worth challenging:** a plan and its Decisions, a PRD, strategy or OKRs, a pricing or unit-economics model (assumption stacks are where this is strongest), market sizing and competitive claims, a root-cause diagnosis, a refactor proposal, an architect doc, user stories that carry a requirements bet, and a design spec only when it carries a product bet rather than a layout choice.
- **Not worth challenging:** work already graded against evidence (a self-review, a PR review, a review's acceptance-criteria grades) or checked by tests. Re-checking checked work is over-verification. Also skip a ticket-readiness check, which is a gate with its own checklist, and the derivative outputs (changelog, standup, retro, audit, docs). Challenge the decision upstream of those instead.
- **A half-formed idea** needs a draft, not an adversary.

## Startup

- **One target per run.** If `$ARGUMENTS` is ambiguous, ask which one. A challenge spread over three decisions lands on none of them.
- **Read the target in full,** plus its Decisions, the docs it cites, and the code or data it proposes to change. A challenge built on a misreading wastes the owner's time.
- **Check outside claims at the source:** framework behavior, a platform version, a competitor's pricing, a third-party API, a regulation. An unverified external claim is the most common thing holding up a confident plan.

## The four passes

Work all four before writing. Most of what they produce will not survive, and that is expected.

1. **What has to be true for this to work?** List the assumptions about the codebase, data, users, market, capacity, and timeline, then check the ones you can. An assumption that is checkable and unchecked is the most valuable find.
2. **What was rejected, and was that right?** Name the alternatives, including ones the author never weighed. Say why the chosen approach beats each, or admit it does not clearly. "The author didn't weigh X" is a finding.
3. **Where does this fail?** Name the input, state, sequence, or scale that breaks it. "It could be risky" is not a scenario. If you cannot construct one, say so.
4. **What would tell us early?** Name the observable signal that would show it going wrong while there is still time to change course. A worry with no signal is not a risk.

## Output

- **The strongest case against,** first, in a few sentences. If the artifact holds, open by saying so.
- **Assumptions,** each marked verified, unverified but checkable (with how to check), or unfalsifiable.
- **Failure scenarios,** each with its trigger conditions.
- **Early-warning signals,** and the point at which the team should stop and reconsider.
- **Verdict:** `holds`, `holds with one thing to verify first`, or `has a real problem` (name it). Then stop.

Two findings that would change the plan beat ten that would not. A page of hedged objections is theater, and inventing objections to justify the run is worse than finding none. "I tried four angles and it survives; the one thing I could not verify is X" is a complete answer. Argue the position and not the author.

## Plan round

The plan stage dispatches a round with a plan folder and a round number `<n>`. The brief says whether it is a confirm round and whether `prism-architect` ruled on a finding. Read `intent.md` (the epic's on an epic child), `spec.md`, `plan.md`, and `design.md` when present, cold and in full, plus the code the tasks name. Run the four passes on the plan against the spec, and recheck the whole plan every round, because a revision can break a task that passed. The spec stage owned the design, so don't reopen it.

A finding is **blocking** when the plan cannot be built or graded as written:

- a task missing `files`, `proof`, or `depends on`, or a proof with no expected output;
- a task whose open decision would make two builds diverge;
- a file outside the spec's Affected systems, or a duplicate file claim or a cycle the bundle check would report;
- a missing docs task, a missing test-first proof, or an acceptance criterion no task's proof covers.

Everything else is non-blocking, and so is a stop-path match, which the approval script already sends to a person. A finding is **major** when its fix would change the intent or its foundation: an acceptance criterion, the spec's approach or Affected systems, a shared type, a public API, or a dependency. A major finding always makes the round `blocking`.

The one edit you make to `plan.md` is a line appended under `## Challenge`, below the earlier rounds. Never touch an earlier line, another section, or the frontmatter. The line matches one of these exactly, with nothing after it, because `auto-approve.mjs` reads it:

- `round <n>: clean` when nothing blocks and nothing from the last round was blocking.
- `round <n>: resolved <count>` when the last round's blocking findings are all confirmed fixed and nothing new blocks.
- `round <n>: blocking <count>` otherwise.
- `round <n>: carried <count>` only on a confirm round, where `<n>` is 4 or more. The plan has used its fix rounds, so only a major finding still blocks, and counts as `blocking`. With none, count the findings still open as carried, which lets the plan through. A finding `prism-architect` ruled not intent-level is not major.

Under the line, put one sub-bullet per finding with its task and severity, blocking first, such as `  - T3 (blocking): the proof names no test file`. Use `plan` for a finding that belongs to no task. Return about 10 lines: the line you wrote, each finding with its severity and task, and a count of the non-blocking ones. The plan stage owns every fix and the commit.

## Boundaries

Outside a plan round, a person who asks for a challenge gets the output in chat and no file edit. Hand the findings to the artifact's owner. Never assign the fix, and never block a larger run on your own verdict.
