Writes a release changelog between two git tags, grouped into New Features, Bug Fixes, and Improvements, and saves it to a file. The changelog never appears in chat. Tags: $ARGUMENTS

<!-- atlas:domain-context -->
Populated during onboarding from the team's actual product domain.
<!-- atlas:end -->

## Startup

- **Validate both tags** with `git rev-parse --verify <tag>`. Ask for them when `$ARGUMENTS` has none, running `git fetch --tags` once if a tag is missing locally, and stop if either still does not resolve, because a changelog for the wrong range misleads everyone who reads it.
- **Fetch the commits** with `git log <old>..<new> --pretty=format:"%s" --no-merges`, and build the PR base URL from `git remote get-url origin`. Tell the user the commit count. An empty range usually means reversed tags, so stop and say so.
- **Confirm the output format before generating anything.** Use a Google Doc when a Google Docs tool is connected. Otherwise ask whether they want `.docx`, PDF, or Markdown.

## Parse and categorize

- **Subjects** follow `PRISM-NNNN: description (#PR)` or `PRISM-NNNN - description (#PR)`. Strip the PR number from the text and link it to `<repo-base-url>/pull/N`. Every entry carries a linked PR, and a commit without one gets `⚠️ no PR link`. Check that each link resolves with `gh pr view <n> --json number,url`, and flag a failure `⚠️ unverified PR link` and never leave a broken link.
- **Off-format subjects** go to Other with the raw subject and `⚠️ off-format`. Never drop a commit silently. When over 20% are off-format, ask the user whether to add an appendix or only a count note, since that volume is a commit-convention gap and not a changelog problem.
- **Categorize by the first matching keyword group,** then by meaning. New Features: add, new, create, introduce, implement, initial, support for, enable. Bug Fixes: fix, resolve, patch, correct, revert, hotfix, not found, error, broken, missing, crash, prevent, handle. Improvements: update, improve, refactor, optimize, enhance, migrate, remove, cleanup, upgrade, replace, rename, consolidate, reduce, convert, simplify. "Add error handling" is an improvement, and "fix: add missing validation" is a fix. When a keyword reads wrong, ask whether something was broken before (a fix), whether users can do something new (a feature), or whether an existing thing works better (an improvement), then check the PR title, then the PR body with `gh pr view <n> --json title,body`, then the diff. If it is still unclear, put the entry in Other with `⚠️ ambiguous`, because a wrong category misleads and a flagged one can be audited.

## Entries

- **Describe changes, not commits.** Commits sharing a ticket are usually one change, so write one entry citing every PR ("Added the comparison feature ([#1450], [#1455])"). A feature and its follow-up fix in the same release merge into the final state, because "Added X" plus "Fixed X" tells the reader X shipped broken. Keep them separate, with a note, when the fix reverts the feature or the outcomes are distinct.
- **Write for the reader who is not a developer.** Each entry says what changed for a user, tester, or support agent in terms they would understand. An entry nobody outside the dev team would miss is omitted or folded into a broader one. If a whole category is internal, ask the user whether it should become a one-line maintenance note.
- **Order by reach inside each category:** end-user facing, then admin facing, then internal. Chronology does not matter to the reader.
- **Breaking changes** get their own section first, only when any exist: API contract or schema changes, stored content that needs migration, removed or changed extension points, dependency bumps that break downstream, and new required environment variables or changed defaults. Each entry says what changed, what breaks, and what to do. When one category holds over 60% of the entries, add one sentence under the header naming the release's shape, and otherwise omit it.

```
Release Notes: <old-tag> → <new-tag>
<date>

[optional one-sentence release shape]

⚠️ Breaking Changes (N, only if any)
🚀 New Features (N)
🐛 Bug Fixes (N)
⚡ Improvements (N)
📋 Other (N, only if any)
```

Each entry is `**PRISM-NNNN:** description — [#XXXX](pr-url)`. Omit empty sections.

## Save and ship

- **Save** to `<repo-root>/.claude/changelogs/<old-tag>-to-<new-tag>.<ext>`, creating the directory if needed. Write Markdown directly (`##` section headers, `-` entries). For `.docx` or PDF, build the Markdown first and convert it with the docx or pdf skill. If a conversion fails, offer PDF, then Markdown.
- **Ship it yourself** (authors ship). Run prettier on the changelog file only, since the artifact is Markdown and types, tests, and build have nothing to check. Re-read it cold for session-context leakage per `.prism/rules/writing-voice.md` § Anti-pattern: Session-context leakage. Read `git config --global --get prism.pauseBeforeCommit` first: `true` means state the commit subject and wait for "ship it", and unset means ask once and save the answer with `git config --global`. Commit as `PRISM-NNNN: Add changelog for <old-tag> → <new-tag>`, or `chore: Add changelog for <old-tag> → <new-tag>` when no ticket applies. Push, and open a draft PR with `gh pr create --draft --body-file`, scaffolded from `.github/pull_request_template.md`. If `gh pr list --head <branch>` already finds a PR, the push updates it. When a push adds scope past an existing PR's body, rewrite only the templated sections (Summary, What did you do, Why did you do it, How did you achieve it, Ticket, Type of Change, and the checklist), never Screenshots or Notes with `gh pr edit --body-file`, keep every other section verbatim, and escape a bare `#N` in backticks. The body states the reasoning the diff cannot, and never lists files.
- **The PR is the artifact, not the release.** The team lead owns the release PR. This one has no agent reviewer, so the human flips it ready.
- **Close** with the file path, the commit count, and the PR number.

Before closing the session, append to `.prism/lessons.md` when a commit format or categorization case here went unhandled, or a tag or git assumption proved wrong.

